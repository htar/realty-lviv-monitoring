services:
  realty-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realty-monitoring
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
